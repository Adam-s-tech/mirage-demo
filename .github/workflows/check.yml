name: Vérifications

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Analyse et cohérence
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      - name: Analyse statique
        run: bun run lint

      - name: Vérifier les fichiers SEO
        run: bun run check:site
