name: Redirection vers le lab

# Publication manuelle uniquement : aucun déploiement ne part automatiquement.
# Le dépôt ne publie pas l'application. Seul redirect/index.html est publié,
# pour renvoyer l'ancienne adresse vers https://lab.adamai.fr/demos/ocr-llm-miniature/.
# Activation : Settings > Pages > Source « GitHub Actions », puis Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Préparer la redirection
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Vérifier la page de redirection
        run: |
          test -f redirect/index.html
          grep -q 'https://lab.adamai.fr/demos/ocr-llm-miniature/' redirect/index.html
          grep -q 'http-equiv="refresh"' redirect/index.html

      - name: Configurer Pages
        uses: actions/configure-pages@v5

      - name: Publier l'artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: redirect

  deploy:
    name: Déployer
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
